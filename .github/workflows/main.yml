 Write-Host "=================================" Write-Host "IP Tailscale:" & $tailscale ip -4 Write-Host "Porta: 3389" Write-Host "NLA: ATIVADO" Write-Host "=================================" - name: Manter sessão ativa shell: powershell run: | while ($true) { Start-Sleep -Seconds 60 } ``` ### 3. Salve Clique em **Commit changes**

